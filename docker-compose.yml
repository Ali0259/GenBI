
# ---------------------------------------------------------------------------
# GenBI Platform - Docker Compose orchestration
#
# This file builds every application image directly from source in this
# repository (backend/, frontend-openui/, frontend-admin/) rather than
# pulling from a container registry. That is the correct default for an
# open-source project someone clones fresh: `docker compose build` always
# works from a clean checkout with no registry account required.
#
# ROUTING MODEL: port-based, not hostname-based.
#
# Earlier versions of this file split the OpenUI and Admin Panel by
# hostname (app.localhost / admin.localhost via Traefik Host() rules).
# That only works if you actually control DNS or hand-edit /etc/hosts on
# every machine that connects -- it breaks the moment someone reaches the
# server by its bare LAN/WAN IP address, which is the common case for a
# fresh self-hosted install. So instead:
#
#   - OpenUI (business users)  -> reachable on port 80  (GENBI_OPENUI_PORT)
#   - Admin Panel (operators)  -> reachable on port 8080 (GENBI_ADMIN_PORT)
#   - Backend API (/api/*)     -> reachable on BOTH of the above ports
#
# This works identically whether you connect via http://<server-ip>/,
# http://yourdomain.com/, or http://localhost/ -- no DNS, no /etc/hosts
# entries, no special-casing an IP address in a Traefik label. It also
# gives you a real security boundary for free: firewall off port 8080
# (e.g. `ufw deny 8080` plus a VPN/SSH-tunnel rule) and the Admin Panel
# becomes unreachable from the public internet while OpenUI stays exposed.
#
# If you later want the Admin Panel on its own real subdomain with TLS
# instead of a port, that's a valid alternative -- see the README's
# "Alternative: hostname-based routing" section for the Traefik labels to
# swap in.
# ---------------------------------------------------------------------------

name: genbi-platform

services:

  admin_database:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ADMIN_DB_NAME}
      POSTGRES_USER: ${ADMIN_DB_USER}
      POSTGRES_PASSWORD: ${ADMIN_DB_PASSWORD}
    volumes:
      - genbi_admin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_DB_USER} -d ${ADMIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - genbi_internal

  redis_cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - genbi_redis_data:/data
    networks:
      - genbi_internal

  backend_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      admin_database:
        condition: service_healthy
    environment:
      GENBI_MASTER_ENCRYPTION_KEY: ${GENBI_MASTER_ENCRYPTION_KEY}
      GENBI_JWT_SIGNING_KEY: ${GENBI_JWT_SIGNING_KEY}
      ADMIN_DATABASE_URL: "postgresql+psycopg://${ADMIN_DB_USER}:${ADMIN_DB_PASSWORD}@admin_database:5432/${ADMIN_DB_NAME}"
      REDIS_URL: "redis://redis_cache:6379/0"
      GENBI_CORS_ALLOWED_ORIGINS: ${GENBI_CORS_ALLOWED_ORIGINS:-*}
      GENBI_DEFAULT_ADMIN_EMAIL: ${GENBI_DEFAULT_ADMIN_EMAIL:-admin@genbi.local}
    volumes:
      - genbi_db_backups:/opt/genbi/backups
      # Bind mount (not a named volume) so the auto-generated default admin
      # credentials file is directly readable from the host filesystem right
      # after install, without needing `docker compose exec`. install.sh
      # creates ./secrets with restrictive permissions before first start.
      - ./secrets:/opt/genbi/secrets
    labels:
      - "traefik.enable=true"
      # Registered on BOTH entrypoints (openui port and admin port) with a
      # higher priority than the two catch-all frontend routers below, so
      # /api/* is matched first regardless of which port the request came
      # in on -- no Host() condition anywhere, so it works via IP, domain,
      # or localhost identically.
      - "traefik.http.routers.genbi-backend-openui.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.genbi-backend-openui.entrypoints=openui"
      - "traefik.http.routers.genbi-backend-openui.priority=10"
      - "traefik.http.routers.genbi-backend-openui.service=genbi-backend-svc"
      - "traefik.http.routers.genbi-backend-admin.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.genbi-backend-admin.entrypoints=adminui"
      - "traefik.http.routers.genbi-backend-admin.priority=10"
      - "traefik.http.routers.genbi-backend-admin.service=genbi-backend-svc"
      - "traefik.http.services.genbi-backend-svc.loadbalancer.server.port=8000"
    networks:
      - genbi_internal

  openui_frontend:
    build:
      context: ./frontend-openui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend_api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genbi-openui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.genbi-openui.entrypoints=openui"
      - "traefik.http.routers.genbi-openui.priority=1"
      - "traefik.http.services.genbi-openui-svc.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - genbi_internal

  admin_panel_frontend:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend_api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genbi-admin.rule=PathPrefix(`/`)"
      - "traefik.http.routers.genbi-admin.entrypoints=adminui"
      - "traefik.http.routers.genbi-admin.priority=1"
      - "traefik.http.services.genbi-admin-svc.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - genbi_internal

  reverse_proxy:
    image: traefik:v3.7.8
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.openui.address=:80"
      - "--entrypoints.adminui.address=:8080"
      - "--entrypoints.websecure.address=:443"
    ports:
      # Host-side ports are configurable via .env; container-internal
      # Traefik entrypoint addresses above stay fixed. Change
      # GENBI_OPENUI_PORT / GENBI_ADMIN_PORT if 80/8080 are already in use
      # on your host, or to firewall the admin port differently.
      - "${GENBI_OPENUI_PORT:-80}:80"
      - "${GENBI_ADMIN_PORT:-8080}:8080"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - genbi_traefik_certs:/letsencrypt
    networks:
      - genbi_internal

  # Optional: only started when the Admin Panel configures an offline LLM
  # provider. Bring it up with: docker compose --profile offline-llm up -d
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["offline-llm"]
    volumes:
      - genbi_ollama_models:/root/.ollama
    networks:
      - genbi_internal

networks:
  genbi_internal:
    driver: bridge

volumes:
  genbi_admin_db_data:
  genbi_redis_data:
  genbi_db_backups:
  genbi_traefik_certs:
  genbi_ollama_models:
